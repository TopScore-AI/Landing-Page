<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>You're Offline — TopScore AI</title>
  <meta name="description" content="TopScore AI requires an internet connection. Check your connection and try again.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#0F1B2C">
  <link rel="icon" type="image/png" href="logo.png">
  <style>
    :root { --ink: #0F1B2C; --paper: #FAF9F4; --red: #E1462C; --slate: #5B6B76; }
    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      text-align: center;
      padding: 24px;
      background: var(--paper);
      color: var(--ink);
    }
    .offline-card { max-width: 420px; }
    h1 {
      font-size: clamp(28px, 5vw, 36px);
      margin: 0 0 12px;
      line-height: 1.15;
    }
    p {
      margin: 0 0 28px;
      color: var(--slate);
      line-height: 1.6;
      font-size: 16px;
    }
    button {
      background: var(--red);
      color: #fff;
      border: none;
      border-radius: 999px;
      padding: 14px 28px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      min-height: 44px;
    }
    button:hover { filter: brightness(1.05); }
    button:focus-visible {
      outline: 3px solid var(--red);
      outline-offset: 3px;
    }
    a {
      display: inline-block;
      margin-top: 16px;
      color: var(--slate);
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="offline-card">
    <h1>You're offline</h1>
    <p>TopScore AI works best with an internet connection.<br>
    Check your connection and try again.</p>
    <button type="button" onclick="location.reload()">Retry</button>
    <br>
    <a href="/">Go to homepage</a>
  </div>
</body>
</html>
